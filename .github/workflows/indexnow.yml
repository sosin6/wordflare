name: IndexNow
# After each deploy, tell Bing/Yandex/Seznam (IndexNow) which pages exist so new and changed pages get crawled fast.
on:
  push:
    branches: [main]
    paths: ['content/**', 'locales/**', 'templates/**', 'scripts/build.mjs']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy
        run: sleep 120
      - name: Submit sitemap URLs
        run: |
          urls=$(curl -fsSL https://wordflare.app/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" '{host:"wordflare.app", key:"2ff9a6228b02ac384231203bf725108d", keyLocation:"https://wordflare.app/2ff9a6228b02ac384231203bf725108d.txt", urlList:$urls}' > body.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json
